services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: secret-santa-bot
      POSTGRES_PASSWORD: secret-santa-dev
      POSTGRES_DB: secret-santa-bot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
