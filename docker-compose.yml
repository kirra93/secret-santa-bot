services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      BOT_TOKEN: ${BOT_TOKEN:?Set BOT_TOKEN}
      DATABASE_URL: postgresql://secret-santa-bot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/secret-santa-bot
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: secret-santa-bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: secret-santa-bot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secret-santa-bot -d secret-santa-bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
